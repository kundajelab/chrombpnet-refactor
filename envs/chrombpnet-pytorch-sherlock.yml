# The PyTorch engine on glibc 2.17 (CentOS 7, as on Stanford's Sherlock),
# where chrombpnet-pytorch.yml's PyTorch 2.14 wheel needs glibc 2.28 and does
# not import. Create from the repository root, on a glibc 2.17 host (else see
# requirements-pytorch-sherlock.txt on igraph and leidenalg), with
#   envs/build-glibc217-wheels.sh <wheel dir>     # once: igraph, leidenalg
#   PIP_FIND_LINKS=<wheel dir> CONDA_OVERRIDE_GLIBC=2.17 \
#     conda env create -f envs/chrombpnet-pytorch-sherlock.yml
# It differs from chrombpnet-pytorch.yml in Python 3.11, NumPy 1.26 and
# PyTorch 2.5.1 (requirements-pytorch-sherlock.txt says why); tangermeme,
# modisco and memelite are chrombpnet-pytorch's. The package goes in without
# its pytorch extra, which asks for PyTorch 2.14.
name: chrombpnet-pytorch-sherlock
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - nomkl
  - numpy=1.26.4
  - h5py=3.16.0
  - pandas=3.0.5
  - scipy=1.17.1
  - scikit-learn=1.9.0
  - pybigwig=0.3.22
  - pyfaidx=0.9.0.4
  - pillow
  # Native Pango/Cairo stack required by the pip-installed WeasyPrint package.
  - pango
  - pytables=3.11.1
  - tqdm=4.70.0
  - termcolor=3.3.0
  - bedtools=2.31.1
  - samtools=1.23
  - ucsc-bedgraphtobigwig=482
  # Provides the `tomtom` executable used by modiscolite report generation.
  - meme=5.5.9
  - pip:
      - -r requirements-pytorch-sherlock.txt
      - -e ..
