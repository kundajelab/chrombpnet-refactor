# TensorFlow engine. Create from the repository root with
#   conda env create -f envs/chrombpnet-tensorflow.yml
# Conda runs the pip section from this file's directory, so the relative
# paths below resolve against envs/.
#
# Python 3.12 and TensorFlow 2.21 (requirements-tensorflow.txt). The engine
# matches the original Keras ChromBPNet (TF 2.8 on Python 3.8) within float
# tolerance, not byte for byte; the original package's own environment runs
# it exactly. Original .h5 models load here too: their count head, a Lambda
# stored as Python 3.8 bytecode, is rebuilt without unmarshalling it.
name: chrombpnet-tensorflow
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy>=2.1
  - h5py>=3.10
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pybigwig>=0.3.22
  - pyfaidx>=0.8
  - pillow
  # Native Pango/Cairo stack required by the pip-installed WeasyPrint package.
  - pango
  - pytables>=3.10
  - tqdm>=4.66
  - termcolor>=2.4
  - bedtools
  - samtools
  - ucsc-bedgraphtobigwig
  # Provides the `tomtom` executable used by modiscolite report generation.
  # 5.5.9's tomtom binary requires at most GLIBC_2.14 (Sherlock supports 2.17).
  - meme=5.5.9
  - pip:
      - -r requirements-tensorflow.txt
      - -e ..[tensorflow]
