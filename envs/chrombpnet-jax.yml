# JAX engine -- a PLACEHOLDER. `--engine jax` is accepted but not implemented
# yet; this environment exists so the implementation has somewhere to land.
# Create from the repository root with
#   conda env create -f envs/chrombpnet-jax.yml
# Conda runs the pip section from this file's directory, so the relative
# paths below resolve against envs/.
#
# The framework-neutral stack is the PyTorch environment's (Python 3.11), so
# the shared preprocessing and downstream code runs on the same releases.
name: chrombpnet-jax
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Conda manages the compiled scientific and command-line stack.
  - python=3.11
  - pip
  - numpy>=1.26,<2
  - h5py>=3.10
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.3
  - pybigwig>=0.3.22
  - pyfaidx>=0.8
  - pillow
  # Native Pango/Cairo stack required by the pip-installed WeasyPrint package.
  - pango
  - pytables>=3.9
  - tqdm>=4.66
  - termcolor>=2.4
  - bedtools
  - samtools
  - ucsc-bedgraphtobigwig
  # Provides the `tomtom` executable used by modiscolite report generation.
  # 5.5.9's tomtom binary requires at most GLIBC_2.14 (Sherlock supports 2.17).
  - meme=5.5.9
  - pip:
      - -r requirements-jax.txt
      - -e ..[jax]
