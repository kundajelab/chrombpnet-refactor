[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrombpnet-refactor"
version = "1.0.1+torch"
description = "ChromBPNet with a choice of deep-learning engine: PyTorch, TensorFlow or JAX"
readme = "README.md"
# Every engine's environment runs Python 3.12 (envs/); TensorFlow 2.21
# supports 3.10 and newer, JAX 0.11 needs 3.12.
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Kundaje Lab"}]
# The framework-neutral stack every engine shares; each engine's environment
# file (envs/chrombpnet-<engine>.yml) pins its own versions on top.
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.7",
  "numpy>=1.23,<3",
  "pandas>=2.0",
  "pyBigWig>=0.3.22",
  "pyfaidx>=0.8",
  "scipy>=1.10",
  "tables>=3.8",
  "termcolor>=2.4",
  "tqdm>=4.66",
  "weasyprint>=52.5",
]

[project.optional-dependencies]
pytorch = [
  "tangermeme @ git+https://github.com/jmschrei/tangermeme.git",
  "torch>=2.14,<2.15",
]
# TensorFlow 2.21 with the Keras 2 API (tf-keras) for the tensorflow engine, and
# Keras 3 for tensorflow-keras3; envs/ adds its CUDA wheels.
tensorflow = [
  "deeplift==0.6.13.0",
  "keras>=3.15.1,<4",
  "tensorflow>=2.21,<2.22",
  "tensorflow-probability>=0.25,<0.26",
  "tf-keras>=2.21,<2.22",
]
# Keras 3 on the JAX backend; needs Python >= 3.12 and NumPy >= 2.1.
jax = ["jax>=0.11.2", "keras>=3.15.1,<4"]
reports = ["modisco @ git+https://github.com/kundajelab/tfmodisco.git"]
test = ["pytest>=8", "pytest-cov>=5", "pillow>=10"]

[project.scripts]
chrombpnet = "chrombpnet.CHROMBPNET:main"
print_meme_motif_file = "chrombpnet.data:print_meme_motif_file"

[tool.setuptools.packages.find]
include = ["chrombpnet*"]

[tool.setuptools.package-data]
"chrombpnet.data" = ["*.txt", "*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "regression: replays the CLI and compares every artifact against a captured baseline (slow; see tests/regression/README.md)",
]
