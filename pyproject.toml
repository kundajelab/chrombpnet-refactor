[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrombpnet-refactor"
version = "1.0.1+torch"
description = "PyTorch replica of ChromBPNet"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Kundaje Lab"}]
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "matplotlib-venn>=0.11.6",
  "numpy>=1.26,<2",
  "pandas>=2.1",
  "pyBigWig>=0.3.22",
  "pyfaidx>=0.8",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "tables>=3.9",
  "tangermeme @ git+https://github.com/jmschrei/tangermeme.git",
  "termcolor>=2.4",
  "torch>=2.5,<2.13",
  "tqdm>=4.66",
  "weasyprint>=52.5",
]

[project.optional-dependencies]
reports = ["modisco>=2.6.0,<3"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
chrombpnet = "chrombpnet.CHROMBPNET:main"
print_meme_motif_file = "chrombpnet.data:print_meme_motif_file"

[tool.setuptools.packages.find]
include = ["chrombpnet*"]

[tool.setuptools.package-data]
"chrombpnet.data" = ["*.txt", "*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
