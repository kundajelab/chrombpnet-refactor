name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # The suite shells out to bedtools, samtools and bedGraphToBigWig, and
      # WeasyPrint needs the native Pango/Cairo stack, so the conda environment
      # is the dependency set -- not pip alone.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/chrombpnet-pytorch.yml
          activate-environment: chrombpnet-pytorch
          auto-activate-base: false

      - name: Report the environment
        run: |
          python -c "import sys, torch; print(sys.version); print('torch', torch.__version__)"
          for tool in bedtools samtools bedGraphToBigWig; do
            printf '%-20s %s\n' "$tool" "$(command -v $tool || echo MISSING)"
          done

      # modiscolite is the optional [reports] extra; the tests that need it
      # skip without it, so the suite is expected to pass either way.
      - name: Run the test suite
        run: python -m pytest -ra

      # Not run on CI: the golden-artifact regression sweep. It compares a run
      # against a baseline captured from another revision, which is a
      # developer workflow rather than a pass/fail gate -- and its artifacts
      # depend on the installed PyTorch build. See tests/regression/README.md.

  # The same suite in the TensorFlow engine's environment (Python 3.8,
  # TF 2.8.0). PyTorch-only tests skip themselves there; the shared code and
  # tests/test_tensorflow_engine.py run. The byte-identity harness against the
  # original implementation (tests/parity) needs a checkout of that repository
  # and is opt-in, so it is not run here.
  pytest-tensorflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/chrombpnet-tensorflow.yml
          activate-environment: chrombpnet-tensorflow
          auto-activate-base: false

      - name: Report the environment
        run: |
          python -c "import sys, tensorflow as tf; print(sys.version); print('tensorflow', tf.__version__)"

      - name: Run the test suite
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -ra

  # The same suite in the JAX engine's environment (Python 3.12, NumPy 2,
  # Keras 3.15 on JAX 0.11), on the CPU: tests/jax_engine/ and the shared code
  # run; PyTorch- and TensorFlow-only tests skip. The agreement harness
  # against the original implementation (tests/parity/jax_engine.py) needs the
  # TensorFlow environment and a checkout of the original, and is opt-in.
  pytest-jax:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/chrombpnet-jax.yml
          activate-environment: chrombpnet-jax
          auto-activate-base: false

      - name: Report the environment
        env:
          JAX_PLATFORMS: cpu
        run: |
          python -c "import sys, chrombpnet.engines.jax, jax, keras; print(sys.version); print('jax', jax.__version__, 'keras', keras.__version__, keras.backend.backend())"

      - name: Run the test suite
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest -ra
