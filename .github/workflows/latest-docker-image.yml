name: Docker Image

# Builds one image per engine environment (dockerfile, --build-arg ENGINE) and
# publishes it to the GitHub Container Registry as
# ghcr.io/<owner>/<repository>:pytorch (also :latest), :jax and :tensorflow.
#
# Run it by hand: Actions -> Docker Image -> Run workflow. It needs no secrets:
# the job's GITHUB_TOKEN may write this repository's packages. A new package is
# private; make it public once, under the owner's Packages -> the package ->
# Package settings -> Change visibility.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pytorch, jax, tensorflow]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Each image holds a framework and its CUDA wheels (10-14 GB), and the
        # conda package cache takes as much again while the environment builds.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          docker image prune --all --force
          df -h /

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          ENGINE: ${{ matrix.engine }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The source label links the package to this repository on GitHub.
          docker build . --file dockerfile --build-arg ENGINE="$ENGINE" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.description=ChromBPNet, the $ENGINE engine" \
            --tag "$IMAGE:$ENGINE"
          docker push "$IMAGE:$ENGINE"
          if [ "$ENGINE" = pytorch ]; then
            docker tag "$IMAGE:$ENGINE" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          df -h /
