name: Docker Image

# Publishing is manual. The previous version of this workflow never ran and
# would have done the wrong thing if it had:
#   * `on: push: branch:` -- the key is `branches`, so the filter was ignored
#   * it targeted `master`; this repository's default branch is `main`
#   * `if: GitHub.ref` -- expression contexts are case-sensitive, so this was
#     never true
#   * it pushed to `kundajelab/chrombpnet:latest`, the upstream TensorFlow
#     image, which this PyTorch fork must not overwrite
#
# Set the DOCKER_IMAGE repository variable (for example
# `myorg/chrombpnet-refactor`) before running it. It builds one image per
# engine environment, tagged :pytorch (also :latest), :jax and :tensorflow.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pytorch, jax, tensorflow]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Each image holds a framework and its CUDA wheels (several GB).
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        env:
          IMAGE: ${{ vars.DOCKER_IMAGE }}
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ -z "$IMAGE" ]; then
            echo "Set the DOCKER_IMAGE repository variable first." >&2
            exit 1
          fi
          docker build . --file dockerfile --build-arg ENGINE="$ENGINE" --tag "$IMAGE:$ENGINE"
          docker push "$IMAGE:$ENGINE"
          if [ "$ENGINE" = pytorch ]; then
            docker tag "$IMAGE:$ENGINE" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
