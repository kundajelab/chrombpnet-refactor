name: chrombpnet-refactor
variables:
  # Required when pip's CUDA PyTorch is imported before conda-forge SciPy:
  # ensure the environment C++ runtime wins over the older host library.
  LD_LIBRARY_PATH: /path/to/workdir/software/miniconda3/envs/chrombpnet-refactor/lib
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=1.26
  - h5py>=3.10
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.3
  - python-igraph
  - leidenalg
  - matplotlib>=3.8
  - matplotlib-venn>=0.11.6
  - pybigwig>=0.3.22
  - pyfaidx>=0.8
  - pytables>=3.9
  - tqdm>=4.66
  - termcolor>=2.4
  - samtools
  - bedtools
  - ucsc-bedgraphtobigwig
  - meme
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.0
      - tangermeme==1.4.1
      - modisco-lite==2.4.0
      - weasyprint>=52.5
      - pytest>=8
      - pytest-cov>=5
      - -e .
